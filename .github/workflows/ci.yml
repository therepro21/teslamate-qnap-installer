name: Validate, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install jsonschema[format] yamllint
      - run: pip install -r manager/requirements.txt tzdata
      - run: python -m json.tool list.json > /dev/null
      - run: python -c "import json,jsonschema; r=json.load(open('list.json')); s=json.load(open('schema/qnap-template.schema.json')); jsonschema.validate(r,s,format_checker=jsonschema.FormatChecker())"
      - run: docker compose config --quiet
      - run: docker compose -f template/teslamate-qnap/docker-compose.yml config --quiet
      - run: python -m unittest discover -s tests -v
      - run: "yamllint -d '{extends: relaxed, rules: {line-length: disable}}' docker-compose.yml template/teslamate-qnap/docker-compose.yml"
  build-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: {platform: [linux/amd64, linux/arm64]}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: manager
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/teslamate-qnap-manager:test
      - run: |
          docker run -d --name manager-test -p 8888:8888 local/teslamate-qnap-manager:test
          for i in $(seq 1 30); do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/)" = 401; then
              password=$(docker exec manager-test cat /data/manager-password)
              curl -fsS -u "admin:$password" http://127.0.0.1:8888/ > /dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify named-volume persistence across container recreate
        run: |
          docker volume create persistence-test
          docker run --rm -v persistence-test:/data local/teslamate-qnap-manager:test sh -c 'echo preserved > /data/probe'
          docker run --rm -v persistence-test:/data local/teslamate-qnap-manager:test sh -c 'test "$(cat /data/probe)" = preserved'
  publish:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teslamate-qnap-installer:1
            ghcr.io/${{ github.repository_owner }}/teslamate-qnap-installer:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
