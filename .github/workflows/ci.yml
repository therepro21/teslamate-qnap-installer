name: Validate, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install jsonschema[format] yamllint
      - run: python -m json.tool list.json > /dev/null
      - run: python -c "import json,jsonschema; r=json.load(open('list.json')); s=json.load(open('schema/qnap-template.schema.json')); jsonschema.validate(r,s,format_checker=jsonschema.FormatChecker())"
      - run: docker compose config --quiet
      - run: docker compose -f template/teslamate-qnap/docker-compose.yml config --quiet
      - run: python -m unittest discover -s tests -v
      - run: "yamllint -d '{extends: relaxed, rules: {line-length: disable}}' docker-compose.yml template/teslamate-qnap/docker-compose.yml"
  build-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: {platform: [linux/amd64, linux/arm64]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: manager
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/teslamate-qnap-manager:test
      - run: |
          docker run -d --name manager-test -p 8888:8888 local/teslamate-qnap-manager:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8888/ && exit 0; sleep 2; done
          docker logs manager-test
          exit 1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teslamate-qnap-installer:1
            ghcr.io/${{ github.repository_owner }}/teslamate-qnap-installer:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "/user/packages/container/teslamate-qnap-installer/visibility" -f visibility=public
